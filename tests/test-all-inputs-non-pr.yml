name: Test all inputs on non-PR event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          bodyContains: "foo|bar"
          bodyDoesNotContain: "baz|qux"
          diffContains: "something"
          diffDoesNotContain: "forbidden"
          linesChanged: "1"
          filesChanged: "1"
          waivedUsers: "dependabot[bot]|someone"
      - name: Assert action succeeded without running PR checks
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIFF: ${{ steps.action.outputs.diff }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diff: $DIFF"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$DIFF" ]; then
            echo "FAIL: expected empty diff output on non-PR event"
            exit 1
          fi
          echo "PASS"
